<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pra Bia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fff1ea;
    --bg2: #ffe1e8;
    --rose: #d6336c;
    --rose-dark: #8c1f4f;
    --ink: #3d0c24;
    --card: #fffaf7;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #2b0f1c;
      --bg2: #3d1327;
      --rose: #ff6f9c;
      --rose-dark: #ffb3cc;
      --ink: #ffe3ee;
      --card: #3a1424;
    }
  }
  :root[data-theme="dark"]{
    --bg: #2b0f1c;
    --bg2: #3d1327;
    --rose: #ff6f9c;
    --rose-dark: #ffb3cc;
    --ink: #ffe3ee;
    --card: #3a1424;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg2), var(--bg));
    color: var(--ink);
    font-family: 'Nunito', sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  .hearts{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  .hearts span{
    position:absolute; bottom:-10%; font-size: 22px; opacity:.35;
    animation: float linear infinite;
    color: var(--rose);
  }
  @keyframes float{
    to{ transform: translateY(-115vh) rotate(20deg); }
  }
  main{
    position:relative; z-index:1;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding: 32px 20px;
  }
  .card{
    width:100%; max-width: 460px;
    background: var(--card);
    border-radius: 28px;
    padding: 40px 28px 34px;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(140,31,79,0.35);
    border: 1px solid rgba(214,51,108,0.15);
  }
  h1{
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-weight:600;
    font-size: 30px;
    line-height:1.25;
    margin: 0 0 6px;
    color: var(--rose-dark);
  }
  p.lead{
    margin: 0 0 30px;
    font-size:15px;
    line-height:1.6;
    opacity:.85;
  }
  .msg{
    min-height: 30px;
    margin: 18px 0 26px;
    font-size:16px;
    font-weight:600;
    color: var(--rose-dark);
  }
  .buttons{
    position:relative;
    display:flex;
    gap:14px;
    justify-content:center;
    flex-wrap:wrap;
    min-height: 130px;
  }
  button{
    font-family:'Nunito', sans-serif;
    font-weight:800;
    font-size:16px;
    border:none;
    border-radius: 999px;
    padding: 14px 26px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .2s ease;
  }
  #yes{
    background: var(--rose);
    color: #fff;
    box-shadow: 0 10px 24px -8px rgba(214,51,108,.7);
  }
  #yes:hover{ transform: translateY(-2px) scale(1.03); }
  #yes:active{ transform: scale(.97); }
  #more{
    background: transparent;
    color: var(--rose-dark);
    border: 2px solid var(--rose);
    position: relative;
  }
  #more.escaping{
    position: fixed;
    z-index: 5;
    transition: left .16s ease, top .16s ease;
  }
  footer{
    margin-top: 26px;
    font-size:12px;
    opacity:.5;
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<main>
  <div class="card">
    <h1>Bia,<br>eu preciso te contar uma coisa</h1>
    <p class="lead">Existem duas opções aqui embaixo.<br>Uma delas é fácil de clicar.</p>

    <div class="msg" id="msg">&nbsp;</div>

    <div class="buttons">
      <button id="yes">Eu te amo 🤍</button>
      <button id="more">Eu te amo mais</button>
    </div>

    <footer>tenta pegar o "mais" se conseguir</footer>
  </div>
</main>

<script>
  // floating hearts background
  const heartsEl = document.getElementById('hearts');
  const symbols = ['♥','❤','💗'];
  for(let i=0;i<18;i++){
    const s = document.createElement('span');
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (10 + Math.random()*14) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    s.style.fontSize = (14 + Math.random()*20) + 'px';
    heartsEl.appendChild(s);
  }

  const yesMessages = [
    "eu te amo, Bia 🤍",
    "muito mesmo",
    "todo dia",
    "viu? já é o máximo que dá"
  ];
  let yesIndex = 0;
  const msg = document.getElementById('msg');
  document.getElementById('yes').addEventListener('click', () => {
    msg.textContent = yesMessages[yesIndex % yesMessages.length];
    yesIndex++;
  });

  // the "eu te amo mais" button that can never be reached
  const moreBtn = document.getElementById('more');

  function dodge(clientX, clientY){
    const rect = moreBtn.getBoundingClientRect();
    const w = rect.width || 160;
    const h = rect.height || 48;
    const margin = 16;
    const maxX = window.innerWidth - w - margin;
    const maxY = window.innerHeight - h - margin;

    let x, y, tries = 0;
    do {
      x = margin + Math.random() * Math.max(1, maxX - margin);
      y = margin + Math.random() * Math.max(1, maxY - margin);
      tries++;
    } while (
      clientX !== undefined &&
      Math.hypot(x - clientX, y - clientY) < 140 &&
      tries < 8
    );

    moreBtn.classList.add('escaping');
    moreBtn.style.left = x + 'px';
    moreBtn.style.top = y + 'px';
  }

  moreBtn.addEventListener('mouseenter', (e) => dodge(e.clientX, e.clientY));
  moreBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    dodge(t.clientX, t.clientY);
  }, { passive: false });
  moreBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge(e.clientX, e.clientY);
  });

  window.addEventListener('resize', () => {
    if (moreBtn.classList.contains('escaping')) dodge();
  });
</script>

</body>
</html>
